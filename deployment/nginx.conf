# ==============================================================================
# KantinQ - Nginx Reverse Proxy & Subpath Deployment Configuration
# Target: Ubuntu / Debian / Raspberry Pi OS
# Subpath: https://<SERVER_IP>/kantinq
# ==============================================================================

# 1. HTTP Server - Redirect All Plain Traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server - SSL Termination & Static SPA Hosting
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # --------------------------------------------------------------------------
    # SSL Configuration (Self-Signed or Let's Encrypt Certificate)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/ssl/certs/kantinq-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/kantinq-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Document Root for the Server
    root /var/www/html;
    index index.html index.htm;

    # --------------------------------------------------------------------------
    # KantinQ Web Application (React SPA mapped to /kantinq subpath)
    # --------------------------------------------------------------------------
    location /kantinq {
        alias /var/www/html/kantinq/;
        index index.html;

        # Fallback to /kantinq/index.html for React Router & client-side routes
        try_files $uri $uri/ /kantinq/index.html;

        # Static assets cache optimization
        location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }
    }

    # --------------------------------------------------------------------------
    # KantinQ API Reverse Proxy (Optional backend integration)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Root redirect: Accessing https://<IP>/ redirects to https://<IP>/kantinq/
    # --------------------------------------------------------------------------
    location = / {
        return 301 /kantinq/;
    }

    # Logging
    access_log /var/log/nginx/kantinq_access.log;
    error_log /var/log/nginx/kantinq_error.log warn;
}

